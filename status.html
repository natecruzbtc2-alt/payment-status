<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Status</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --ink: #14171A;
    --ink-2: #5B6168;
    --ink-3: #9BA1A8;
    --line: #E8E9EB;
    --line-strong: #DCDEE1;
    --accent: #1D6FE0;
    --accent-soft: #EAF2FE;
    --success: #17835B;
    --success-soft: #E6F5EE;
    --shadow-1: 0 1px 2px rgba(20,23,26,0.04);
    --shadow-2: 0 1px 1px rgba(20,23,26,0.03), 0 12px 28px -8px rgba(20,23,26,0.14);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0B0D10;
      --surface: #14171B;
      --ink: #F1F2F4;
      --ink-2: #9BA3AD;
      --ink-3: #676F79;
      --line: #232830;
      --line-strong: #2C323C;
      --accent: #5B93F5;
      --accent-soft: rgba(91,147,245,0.14);
      --success: #34C98B;
      --success-soft: rgba(52,201,139,0.12);
      --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-2: 0 1px 1px rgba(0,0,0,0.2), 0 20px 40px -12px rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #0B0D10;
    --surface: #14171B;
    --ink: #F1F2F4;
    --ink-2: #9BA3AD;
    --ink-3: #676F79;
    --line: #232830;
    --line-strong: #2C323C;
    --accent: #5B93F5;
    --accent-soft: rgba(91,147,245,0.14);
    --success: #34C98B;
    --success-soft: rgba(52,201,139,0.12);
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: 'tnum' 1, 'cv01' 1;
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before{
    content: '';
    position: fixed;
    top: -20%; left: 50%;
    width: 900px; height: 700px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--accent-soft), transparent 70%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .card-wrap{ max-width: 400px; width: 100%; position: relative; z-index: 1; }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-2);
    padding: 36px 32px 28px;
  }

  .eyebrow{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
  }
  h1{
    font-size: 27px;
    font-weight: 550;
    letter-spacing: -0.015em;
    line-height: 1.2;
    margin: 0 0 18px;
  }

  .pill{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px 6px 10px;
    border-radius: 100px;
    margin-bottom: 28px;
  }
  .pill.done{ background: var(--success-soft); color: var(--success); }
  .pill .ring{
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    position: relative;
  }
  .pill:not(.done) .ring::after{
    content: '';
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0.35;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100% { transform: scale(0.85); opacity: 0.35; }
    50% { transform: scale(1.15); opacity: 0; }
  }

  .timeline{ display: flex; flex-direction: column; }
  .step{
    display: flex;
    align-items: flex-start;
    gap: 14px;
    position: relative;
    padding-bottom: 22px;
  }
  .step:last-child{ padding-bottom: 0; }
  .step-rail{
    display: flex; flex-direction: column; align-items: center;
    flex-shrink: 0;
  }
  .step-dot{
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-dot svg{ width: 10px; height: 10px; display: none; }
  .step.done .step-dot{ background: var(--ink); border-color: var(--ink); }
  .step.done .step-dot svg{ display: block; }
  .step.done .step-dot path{ stroke: var(--surface); }
  .step.current .step-dot{ border-color: var(--accent); border-width: 2px; }
  .step-line{
    width: 1.5px; flex: 1;
    background: var(--line-strong);
    margin-top: 2px;
    min-height: 18px;
  }
  .step.done .step-line{ background: var(--ink-3); }
  .step-body{ flex: 1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-top: 1px; }
  .step-name{ font-size: 14.5px; color: var(--ink-3); font-weight: 450; }
  .step.done .step-name,
  .step.current .step-name{ color: var(--ink); font-weight: 500; }
  .step-time{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-3);
    flex-shrink: 0;
    white-space: nowrap;
  }

  .foot{
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .foot-label{ font-size: 11.5px; color: var(--ink-3); }
  .foot-value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-2);
  }

  .state-msg{
    text-align: center;
    color: var(--ink-2);
    font-size: 14.5px;
    padding: 32px 8px;
  }

  @media (prefers-reduced-motion: no-preference){
    .card-wrap{ animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .pill:not(.done) .ring::after{ animation: none; }
  }

  @media (max-width: 400px){
    .card{ padding: 28px 22px 22px; }
    h1{ font-size: 23px; }
  }
</style>
</head>
<body>
<div class="card-wrap" id="wrap">
  <div class="card" id="card">
    <div class="state-msg">Loading…</div>
  </div>
</div>

<script>
const API_URL = 'https://api.github.com/repos/natecruzbtc2-alt/payment-status/contents/data/clients.json?ref=main';
const CDN_URL = 'https://raw.githubusercontent.com/natecruzbtc2-alt/payment-status/main/data/clients.json';

const STATUSES = [
  { key: 'waiting',    label: 'Awaiting payment' },
  { key: 'received',   label: 'Payment received' },
  { key: 'processing', label: 'Payment processing' },
  { key: 'approved',   label: 'Payment approved' },
  { key: 'sent',       label: 'Payment sent' }
];

const CHECK_SVG = '<svg viewBox="0 0 10 10" fill="none"><path d="M1.5 5.2L3.8 7.5L8.5 2.5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function getId(){
  return new URLSearchParams(window.location.search).get('id');
}
function timeFor(history, key){
  if(!Array.isArray(history)) return '';
  const entry = history.find(h => h.status === key);
  if(!entry) return '';
  return new Date(entry.ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function showMessage(text){
  document.getElementById('card').innerHTML = `<div class="state-msg">${text}</div>`;
}

async function fetchClients(){
  try{
    const res = await fetch(API_URL, {
      headers: { 'Accept': 'application/vnd.github.raw' },
      cache: 'no-store'
    });
    if(res.ok) return await res.json();
  }catch(e){
    console.warn('API fetch failed, falling back to CDN', e);
  }
  const res = await fetch(`${CDN_URL}?t=${Date.now()}`, { cache: 'no-store' });
  if(!res.ok) throw new Error(`CDN fetch failed: ${res.status}`);
  return await res.json();
}

async function loadStatus(){
  const id = getId();
  if(!id){ showMessage('No client specified.'); return; }
  try{
    const data = await fetchClients();
    const list = Array.isArray(data.clients) ? data.clients : [];
    const client = list.find(c => c.id === id);
    if(!client){ showMessage("We couldn't find that payment status."); return; }
    render(client);
  }catch(e){
    console.error('Load failed', e);
    showMessage('Something went wrong loading this page.');
  }
}

function render(client){
  const currentIndex = STATUSES.findIndex(s => s.key === client.status);
  const history = client.status_history || [];
  const currentLabel = STATUSES[currentIndex] ? STATUSES[currentIndex].label : 'Unknown';
  const isFinal = client.status === 'sent';

  const stepsHtml = STATUSES.map((s, i) => {
    const done = i < currentIndex;
    const isCurrent = i === currentIndex;
    const cls = done ? 'done' : (isCurrent ? 'current' : '');
    const time = (done || isCurrent) ? timeFor(history, s.key) : '';
    const isLast = i === STATUSES.length - 1;
    return `
      <div class="step ${cls}">
        <div class="step-rail">
          <div class="step-dot">${CHECK_SVG}</div>
          ${!isLast ? '<div class="step-line"></div>' : ''}
        </div>
        <div class="step-body">
          <span class="step-name">${s.label}</span>
          <span class="step-time">${time}</span>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('card').innerHTML = `
    <p class="eyebrow">Payment status</p>
    <h1>${escapeHtml(client.client_name)}</h1>
    <div class="pill ${isFinal ? 'done' : ''}"><span class="ring"></span>${escapeHtml(currentLabel)}</div>
    <div class="timeline">${stepsHtml}</div>
    <div class="foot">
      <span class="foot-label">Reference</span>
      <span class="foot-value">${escapeHtml(client.id)}</span>
    </div>
  `;
}

loadStatus();
setInterval(loadStatus, 15000);
</script>
</body>
</html>
