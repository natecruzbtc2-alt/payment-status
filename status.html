<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Status</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #F6F2E7;
    --paper-edge: #EFE9D8;
    --ink: #211F17;
    --ink-soft: #736E5A;
    --ink-faint: #A39C82;
    --rule: #D8D0B8;
    --amber: #A5691B;
    --amber-bg: #F1E3C8;
    --green: #2F6B4F;
    --green-bg: #DCEBDF;
    --page-bg: #E8E2D0;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--page-bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(33,31,23,0.05) 1px, transparent 0);
    background-size: 18px 18px;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 48px 16px;
  }

  .receipt-wrap{ max-width: 380px; width: 100%; }

  .zig-top, .zig-bottom{
    height: 12px;
    background: var(--paper);
  }
  .zig-top{
    clip-path: polygon(
      0% 100%, 4.16% 0%, 8.33% 100%, 12.5% 0%, 16.66% 100%, 20.83% 0%,
      25% 100%, 29.16% 0%, 33.33% 100%, 37.5% 0%, 41.66% 100%, 45.83% 0%,
      50% 100%, 54.16% 0%, 58.33% 100%, 62.5% 0%, 66.66% 100%, 70.83% 0%,
      75% 100%, 79.16% 0%, 83.33% 100%, 87.5% 0%, 91.66% 100%, 95.83% 0%, 100% 100%
    );
  }
  .zig-bottom{
    clip-path: polygon(
      0% 0%, 4.16% 100%, 8.33% 0%, 12.5% 100%, 16.66% 0%, 20.83% 100%,
      25% 0%, 29.16% 100%, 33.33% 0%, 37.5% 100%, 41.66% 0%, 45.83% 100%,
      50% 0%, 54.16% 100%, 58.33% 0%, 62.5% 100%, 66.66% 0%, 70.83% 100%,
      75% 0%, 79.16% 100%, 83.33% 0%, 87.5% 100%, 91.66% 0%, 95.83% 100%, 100% 0%
    );
  }

  .receipt{
    background: var(--paper);
    padding: 8px 30px 30px;
    box-shadow: 0 2px 3px rgba(33,31,23,0.05), 0 18px 40px rgba(33,31,23,0.14);
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    margin: 18px 0 2px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 18px;
    line-height: 1.15;
  }

  .stamp{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid var(--amber);
    color: var(--amber);
    background: var(--amber-bg);
    padding: 7px 14px 7px 12px;
    border-radius: 3px;
    transform: rotate(-1.4deg);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 22px;
  }
  .stamp.done{ border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .stamp .dot{ width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink:0; }

  .rule{
    border: none;
    border-top: 1px dashed var(--rule);
    margin: 0 0 18px;
  }

  .timeline{ display:flex; flex-direction:column; margin-bottom: 6px; }
  .step{ display:flex; align-items: baseline; gap: 12px; padding: 7px 0; }
  .step .mark{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    width: 14px; flex-shrink:0;
    color: var(--ink-faint);
  }
  .step.done .mark{ color: var(--green); }
  .step.current .mark{ color: var(--amber); }
  .step .name{
    flex: 1;
    font-size: 14px;
    color: var(--ink-faint);
  }
  .step.done .name, .step.current .name{ color: var(--ink); font-weight: 500; }
  .step .when{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
  }

  .footer-rule{
    border: none;
    border-top: 1px dashed var(--rule);
    margin: 20px 0 12px;
  }
  .ref{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-faint);
    display:flex;
    justify-content: space-between;
  }

  .state-msg{
    text-align:center; color: var(--ink-soft); font-size: 14px;
    padding: 40px 20px;
    font-family: 'Inter', sans-serif;
  }

  @media (prefers-reduced-motion: no-preference){
    .receipt-wrap{ animation: settle 0.4s ease-out; }
  }
  @keyframes settle{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="receipt-wrap" id="wrap">
  <div class="zig-top"></div>
  <div class="receipt" id="receipt">
    <div class="state-msg">Loading…</div>
  </div>
  <div class="zig-bottom"></div>
</div>

<script>
const API_URL = 'https://api.github.com/repos/natecruzbtc2-alt/payment-status/contents/data/clients.json?ref=main';
const CDN_URL = 'https://raw.githubusercontent.com/natecruzbtc2-alt/payment-status/main/data/clients.json';

const STATUSES = [
  { key: 'waiting',    label: 'Awaiting payment' },
  { key: 'received',   label: 'Payment received' },
  { key: 'processing', label: 'Payment processing' },
  { key: 'approved',   label: 'Payment approved' },
  { key: 'sent',       label: 'Payment sent' }
];

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function getId(){
  return new URLSearchParams(window.location.search).get('id');
}

function timeFor(history, key){
  if(!Array.isArray(history)) return '';
  const entry = history.find(h => h.status === key);
  if(!entry) return '';
  return new Date(entry.ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function showMessage(text){
  document.getElementById('receipt').innerHTML = `<div class="state-msg">${text}</div>`;
}

async function fetchClients(){
  // The GitHub API reflects commits immediately, but is rate-limited for
  // anonymous requests. The CDN has no meaningful rate limit but can lag
  // a commit by a few minutes. Try the API first; fall back to the CDN.
  try{
    const res = await fetch(API_URL, {
      headers: { 'Accept': 'application/vnd.github.raw' },
      cache: 'no-store'
    });
    if(res.ok){
      return await res.json();
    }
  }catch(e){
    console.warn('API fetch failed, falling back to CDN', e);
  }
  const res = await fetch(`${CDN_URL}?t=${Date.now()}`, { cache: 'no-store' });
  if(!res.ok) throw new Error(`CDN fetch failed: ${res.status}`);
  return await res.json();
}

async function loadStatus(){
  const id = getId();
  if(!id){ showMessage('No client specified.'); return; }

  try{
    const data = await fetchClients();
    const list = Array.isArray(data.clients) ? data.clients : [];
    const client = list.find(c => c.id === id);
    if(!client){ showMessage("We couldn't find that payment status."); return; }
    render(client);
  }catch(e){
    console.error('Load failed', e);
    showMessage('Something went wrong loading this page.');
  }
}

function render(client){
  const currentIndex = STATUSES.findIndex(s => s.key === client.status);
  const history = client.status_history || [];
  const currentLabel = STATUSES[currentIndex] ? STATUSES[currentIndex].label : 'Unknown';
  const isFinal = client.status === 'sent';

  const stepsHtml = STATUSES.map((s, i) => {
    const done = i < currentIndex;
    const isCurrent = i === currentIndex;
    const mark = done ? '✓' : (isCurrent ? '›' : '·');
    const cls = done ? 'done' : (isCurrent ? 'current' : '');
    const time = (done || isCurrent) ? timeFor(history, s.key) : '';
    return `
      <div class="step ${cls}">
        <span class="mark">${mark}</span>
        <span class="name">${s.label}</span>
        <span class="when">${time}</span>
      </div>
    `;
  }).join('');

  document.getElementById('receipt').innerHTML = `
    <p class="eyebrow">Payment status</p>
    <h1>${escapeHtml(client.client_name)}</h1>
    <div class="stamp ${isFinal ? 'done' : ''}"><span class="dot"></span>${escapeHtml(currentLabel)}</div>
    <hr class="rule">
    <div class="timeline">${stepsHtml}</div>
    <hr class="footer-rule">
    <div class="ref"><span>ref</span><span>${escapeHtml(client.id)}</span></div>
  `;
}

loadStatus();
setInterval(loadStatus, 15000);
</script>
</body>
</html>
