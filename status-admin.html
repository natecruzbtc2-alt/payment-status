<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Status — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0F2E1D;
    --card: #163823;
    --line: #2A4D37;
    --gold: #D4A843;
    --gold-bright: #F0C464;
    --cream: #F5F0E1;
    --cream-dim: #B9C4B7;
    --red: #C1443B;
    --green: #97C459;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); }
  body{ font-family:'Inter', sans-serif; color: var(--cream); min-height:100vh; padding: 40px 24px 80px; }
  .wrap{ max-width: 760px; margin: 0 auto; }

  h1{ font-family:'Fraunces', serif; font-weight:600; font-size: 32px; margin: 0 0 4px; }
  .sub{ color: var(--cream-dim); font-size: 14px; margin: 0 0 28px; }

  .panel{ background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 20px; }
  .panel h2{ font-family:'Fraunces', serif; font-weight:600; font-size: 17px; margin: 0 0 16px; }

  form{ display:flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field{ display:flex; flex-direction:column; gap:6px; flex:1; min-width: 160px; }
  .field label{ font-size: 12px; color: var(--cream-dim); }
  input{ background: var(--bg); border: 1px solid var(--line); color: var(--cream); padding: 10px 12px; border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif; outline:none; }
  input:focus{ border-color: var(--gold); }
  button{ background: var(--gold); color:#1A2E1E; border:none; padding: 11px 20px; border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter', sans-serif; }
  button:hover{ background: var(--gold-bright); }

  .clients{ display:flex; flex-direction:column; gap: 12px; }
  .client{ background: var(--card); border:1px solid var(--line); border-radius:10px; padding: 16px 18px; }
  .client-top{ display:flex; justify-content:space-between; align-items:center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .client-name{ font-size: 16px; font-weight: 600; }
  .client-actions{ display:flex; gap: 10px; align-items:center; }
  .client-actions button{ background: transparent; border:none; padding: 2px 4px; color: var(--cream-dim); font-size:12px; text-decoration:underline; cursor:pointer; }
  .client-actions button:hover{ color: var(--gold-bright); }
  .client-actions .delete-client:hover{ color: var(--red); }

  .status-picker{ display:flex; gap:8px; flex-wrap: wrap; margin-bottom: 12px; }
  .status-btn{
    background: var(--bg); border: 1px solid var(--line); color: var(--cream-dim);
    padding: 7px 14px; border-radius: 20px; font-size: 12px; cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .status-btn:hover{ border-color: var(--gold); }
  .status-btn.active{ background: var(--gold); color:#1A2E1E; border-color: var(--gold); font-weight:600; }

  .link-row{ display:flex; align-items:center; gap:8px; font-size: 12px; color: var(--cream-dim); }
  .link-row code{ background: var(--bg); padding: 5px 10px; border-radius:5px; font-family:'IBM Plex Mono', monospace; font-size: 11px; flex:1; overflow-x:auto; white-space: nowrap; }
  .link-row button{ padding: 6px 12px; font-size: 12px; }

  .empty{ color: var(--cream-dim); font-size: 14px; padding: 30px 0; text-align:center; }
  .copied{ color: var(--green); font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Payment status — admin</h1>
  <p class="sub">Add clients, update their status, and share their personal link.</p>

  <div class="panel">
    <h2>Add a client</h2>
    <form id="addForm">
      <div class="field">
        <label for="nameInput">Client name</label>
        <input id="nameInput" placeholder="Type a name" autocomplete="off">
      </div>
      <button type="submit">Add client</button>
    </form>
  </div>

  <div class="panel">
    <h2>Clients</h2>
    <div class="clients" id="clients"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://spcxjfamozmnkgowztij.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwY3hqZmFtb3ptbmtnb3d6dGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNjU2OTgsImV4cCI6MjEwMzc0MTY5OH0._hKnAK5gLwwLArYLShxTL3Abpv4ZN2LGqz5PKti-Apc';

const STATUSES = [
  { key: 'waiting', label: 'Awaiting payment' },
  { key: 'received', label: 'Payment received' },
  { key: 'processing', label: 'Payment processing' },
  { key: 'approved', label: 'Payment approved' },
  { key: 'sent', label: 'Payment sent' }
];

let clients = [];

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function slugify(name){
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

async function loadClients(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_payments?select=*&order=updated_at.desc`, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
    clients = await res.json();
  }catch(e){
    console.error('Load failed', e);
    clients = [];
  }
  render();
}

async function upsertClient(client){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/client_payments?on_conflict=id`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(client)
    });
    if(!res.ok) console.error('Save failed', res.status, await res.text());
  }catch(e){
    console.error('Save failed', e);
  }
}

async function deleteClientRow(id){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/client_payments?id=eq.${id}`, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      }
    });
  }catch(e){
    console.error('Delete failed', e);
  }
}

function render(){
  const container = document.getElementById('clients');
  if(!clients.length){
    container.innerHTML = '<div class="empty">No clients yet. Add one above.</div>';
    return;
  }

  container.innerHTML = clients.map(c => {
    const link = `${window.location.origin}${window.location.pathname.replace('admin.html','')}status.html?id=${c.id}`;
    return `
    <div class="client">
      <div class="client-top">
        <div class="client-name">${escapeHtml(c.client_name)}</div>
        <div class="client-actions">
          <button type="button" class="delete-client" data-id="${c.id}">Delete</button>
        </div>
      </div>
      <div class="status-picker">
        ${STATUSES.map(s => `
          <button type="button" class="status-btn ${c.status===s.key?'active':''}" data-id="${c.id}" data-status="${s.key}">${s.label}</button>
        `).join('')}
      </div>
      <div class="link-row">
        <code id="link-${c.id}">${link}</code>
        <button type="button" class="copy-link" data-id="${c.id}">Copy link</button>
        <span class="copied" id="copied-${c.id}" style="display:none;">Copied</span>
      </div>
    </div>
    `;
  }).join('');

  container.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const status = btn.dataset.status;
      const client = clients.find(c => c.id === id);
      if(client){
        if(client.status !== status){
          const history = Array.isArray(client.status_history) ? [...client.status_history] : [];
          history.push({ status, ts: new Date().toISOString() });
          client.status_history = history;
        }
        client.status = status;
        client.updated_at = new Date().toISOString();
        await upsertClient(client);
        render();
      }
    });
  });

  container.querySelectorAll('.delete-client').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const client = clients.find(c => c.id === id);
      if(!confirm(`Delete ${client ? client.client_name : 'this client'}?`)) return;
      await deleteClientRow(id);
      clients = clients.filter(c => c.id !== id);
      render();
    });
  });

  container.querySelectorAll('.copy-link').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const text = document.getElementById(`link-${id}`).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const el = document.getElementById(`copied-${id}`);
        el.style.display = 'inline';
        setTimeout(() => { el.style.display = 'none'; }, 1500);
      });
    });
  });
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if(!name) return;
  let id = slugify(name);
  if(clients.find(c => c.id === id)){
    id = id + '-' + Math.random().toString(36).slice(2,6);
  }
  const client = { id, client_name: name, status: 'waiting', status_history: [{ status: 'waiting', ts: new Date().toISOString() }], updated_at: new Date().toISOString() };
  clients.unshift(client);
  render();
  input.value = '';
  await upsertClient(client);
});

loadClients();
setInterval(loadClients, 15000);
</script>
</body>
</html>
